name: generate arcade contribution graphs

on:
  schedule:
    # Runs automatically every 24 hours
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: generate-arcade-contribution-graph
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: TripleJay23
          # Available options: pacman, breakout, galaga, puzzle-bobble, bomberman
          games: 'galaga'

      - name: push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
